<?xml version="1.0" encoding="UTF-8"?>
<!-- dirtoo: amber folder + blue eye — readable at 16px, detailed at larger sizes -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#e09b00"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="35%" stop-color="#f5a623"/>
      <stop offset="70%" stop-color="#e07800"/>
      <stop offset="100%" stop-color="#b34a00"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="iris" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#d6ebff"/>
      <stop offset="25%" stop-color="#62a0ef"/>
      <stop offset="55%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#0a3d8f"/>
    </radialGradient>
    <radialGradient id="scleraShade" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#c8d0da"/>
    </radialGradient>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="66" cy="117" rx="46" ry="7" fill="#3d2000" opacity="0.22"/>

  <!-- Folder tab -->
  <path d="M 18 30
           C 18 26 20 24 24 24
           L 52 24
           L 60 34
           L 104 34
           C 108 34 110 36 110 40
           L 110 48
           L 18 48
           Z"
        fill="url(#tab)" stroke="#7a3a00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Folder body -->
  <path d="M 14 46
           C 14 42 16 40 20 40
           L 108 40
           C 112 40 114 42 114 46
           L 108 108
           C 107 112 104 114 100 114
           L 28 114
           C 24 114 21 112 20 108
           Z"
        fill="url(#body)" stroke="#5c2800" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left highlight strip on body -->
  <path d="M 22 48 L 48 48 L 44 104 L 26 104 Z" fill="url(#bodySide)"/>

  <!-- Top rim shine -->
  <path d="M 22 48 L 106 48 L 103 58 L 25 58 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Inner pocket shade (depth) -->
  <path d="M 26 62 L 102 62 L 98 104 L 30 104 Z" fill="#8a3d00" opacity="0.18"/>

  <!-- Eye sclera -->
  <ellipse cx="64" cy="80" rx="34" ry="22"
           fill="url(#scleraShade)" stroke="#1a2332" stroke-width="2.5"/>

  <!-- Iris ring (outer) -->
  <circle cx="64" cy="80" r="16.5" fill="url(#iris)" stroke="#062a66" stroke-width="1.2"/>

  <!-- Iris texture rings -->
  <circle cx="64" cy="80" r="12.5" fill="none" stroke="#0b4ea8" stroke-width="0.8" opacity="0.55"/>
  <circle cx="64" cy="80" r="9" fill="none" stroke="#7eb6f5" stroke-width="0.7" opacity="0.45"/>

  <!-- Pupil -->
  <circle cx="64" cy="80" r="6.5" fill="#050a12"/>

  <!-- Primary catchlight -->
  <circle cx="58" cy="74" r="3.8" fill="#ffffff" opacity="0.95"/>
  <!-- Secondary catchlight -->
  <circle cx="70" cy="84" r="1.8" fill="#ffffff" opacity="0.55"/>

  <!-- Subtle eyelid hint (upper) -->
  <path d="M 32 72 Q 64 58 96 72" fill="none" stroke="#1a2332" stroke-width="1.4"
        stroke-linecap="round" opacity="0.35"/>
</svg>
