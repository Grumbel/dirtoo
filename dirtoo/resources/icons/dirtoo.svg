<?xml version="1.0" encoding="UTF-8"?>
<!-- dirtoo: folder + eye — bold shapes for 16px, gradients for larger sizes -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="100%" stop-color="#f0c000"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="50%" stop-color="#e5a50a"/>
      <stop offset="100%" stop-color="#c64600"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#b6d4fa"/>
      <stop offset="40%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </radialGradient>
  </defs>

  <!-- Drop shadow (simple ellipse, no SVG filters — portable) -->
  <ellipse cx="66" cy="116" rx="44" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Folder tab -->
  <path d="M 16 32
           C 16 28 18 26 22 26
           L 50 26
           L 58 34
           L 106 34
           C 110 34 112 36 112 40
           L 112 46
           L 16 46
           Z"
        fill="url(#tab)" stroke="#6b2d00" stroke-width="3" stroke-linejoin="round"/>

  <!-- Folder body -->
  <path d="M 12 44
           C 12 40 14 38 18 38
           L 110 38
           C 114 38 116 40 116 44
           L 110 110
           C 109 114 106 116 102 116
           L 26 116
           C 22 116 19 114 18 110
           Z"
        fill="url(#body)" stroke="#4a1c00" stroke-width="3" stroke-linejoin="round"/>

  <!-- Top highlight on body -->
  <path d="M 20 46 L 108 46 L 104 68 L 24 68 Z" fill="#ffffff" opacity="0.22"/>

  <!-- Sclera -->
  <ellipse cx="64" cy="78" rx="36" ry="24"
           fill="#ffffff" stroke="#1e293b" stroke-width="3"/>

  <!-- Iris -->
  <circle cx="64" cy="78" r="15" fill="url(#iris)" stroke="#0b3d91" stroke-width="1.5"/>

  <!-- Pupil -->
  <circle cx="64" cy="78" r="7" fill="#0b1220"/>

  <!-- Catchlights (read as “eye” even at 16px when iris is blue) -->
  <circle cx="58" cy="72" r="3.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="71" cy="82" r="1.6" fill="#ffffff" opacity="0.55"/>
</svg>
